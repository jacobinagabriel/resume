name: Publica currículo no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Gera o PDF
        run: python build.py

      - name: Monta o site
        run: |
          mkdir -p site/assets
          cp resume.html site/index.html
          cp style.css resume.pdf site/
          cp resume.pdf site/gabriel-jacobina.pdf
          cp assets/*.svg site/assets/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
